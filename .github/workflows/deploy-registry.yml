name: Deploy registry to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run registry:build
        env:
          REGISTRY_BASE_URL: https://dosepehr.github.io/frontend-foundation/r
      - run: mkdir -p dist/r && cp -r public/r/. dist/r/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      # Rebuild dosepehr.github.io so its docs and changelog pick up this push.
      # Needs SITE_DISPATCH_TOKEN: a fine-grained token with Contents: read and
      # write on dosepehr/dosepehr.github.io. Without it the site still picks
      # the push up on its daily rebuild.
      - name: Trigger docs site rebuild
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN is not set; skipping the docs site rebuild."
            exit 0
          fi
          gh api repos/dosepehr/dosepehr.github.io/dispatches -f event_type=foundation-updated
